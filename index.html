<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

 <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BHKWRS35Y7"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-BHKWRS35Y7');
</script>

 <link rel="stylesheet" href="styles.css" />

</head>
<body>
  <div class="header">
    <a href="index.html">首頁</a>
    <a href="about.html">關於</a>
    <a href="contact.html">聯絡</a>
  </div>

  <div class="container">
    <div class="card">
      <h1>GA4 多頁測試站 - 首頁</h1>
      <p>這是首頁，用來測試 page_view、按鈕點擊和頁面切換。</p>
      <p class="small">當前頁面：<code>index.html</code></p>
    </div>

    <div class="card">
      <h2>按鈕事件</h2>
      <button class="btn" onclick="trackEvent('home_button_click', {button_name: 'home_blue'})">
  首頁藍色按鈕
</button>

<button class="btn green" onclick="trackEvent('home_button_click', {button_name: 'home_green'})">
  首頁綠色按鈕
</button>

    </div>

    <div class="card">
      <h2>導覽到其他頁面</h2>
      <p>請點上方導覽列，觀察頁面切換事件是否有送出。</p>
    </div>

    <div class="footer">
      首頁測試完成後，請到 GA4 Realtime 或 DebugView 檢查事件。
    </div>
  </div>

<script>
  function trackEvent(eventName, params) {
    if (typeof gtag === 'function') {
      gtag('event', eventName, params);
      console.log('已送出事件：', eventName, params);
      alert('已送出事件：' + eventName);
    } else {
      console.error('gtag 尚未載入');
      alert('gtag 尚未載入');
    }
  }
</script>

</body>
</html>
