<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>關於｜GA4 展示版</title>

  <script async src="https://www.googletagmanager.com/gtag/js?id=G-BHKWRS35Y7"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-BHKWRS35Y7', { debug_mode: true });
  </script>

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <a class="brand" href="index.html" onclick="trackNav('index')">GA4 展示版</a>
      <nav class="nav">
        <a href="index.html" onclick="trackNav('index')">首頁</a>
        <a href="about.html" onclick="trackNav('about')">關於</a>
        <a href="contact.html" onclick="trackNav('contact')">聯絡</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <span class="badge">About</span>
      <h1>關於這個專案</h1>
      <p>這是一個用於學習 GA4 的多頁網站，目的是透過真實互動資料觀察使用者行為，並練習如何做數據分析與網站優化。</p>
    </section>

    <section class="grid">
      <div class="card">
        <h2>學習目標</h2>
        <ul class="list-clean">
          <li>了解 page_view 與事件追蹤</li>
          <li>學習如何設計 GA4 事件</li>
          <li>練習觀察 Realtime / DebugView</li>
          <li>學會根據數據改善網站</li>
        </ul>
      </div>

      <div class="card">
        <h2>互動測試</h2>
        <p>按這個按鈕會送出 <code>about_click</code>：</p>
        <button class="btn amber" onclick="trackEvent('about_click', {section: 'about_page'})">送出 about_click</button>
      </div>

      <div class="card">
        <h2>延伸連結</h2>
        <a href="https://analytics.google.com/" target="_blank" rel="noopener"
           onclick="trackOutbound('https://analytics.google.com/', 'Google Analytics')">前往 Google Analytics</a>
      </div>
    </section>

    <div class="footer">
      <p>這一頁的重點是觀察關於頁是否能產生瀏覽與互動數據。</p>
    </div>
  </main>

  <script>
    function trackEvent(eventName, params) {
      if (typeof gtag === 'function') gtag('event', eventName, params);
      console.log(eventName, params);
    }

    function trackNav(linkName) {
      trackEvent('nav_click', { link_name: linkName });
    }

    function trackOutbound(url, text) {
      trackEvent('outbound_click', { link_url: url, link_text: text });
    }
  </script>
</body>
