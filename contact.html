<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>聯絡｜GA4 測試站</title>

 <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-BHKWRS35Y7"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-BHKWRS35Y7');
</script>

  <link rel="stylesheet" href="styles.css" />

</head>
<body>
  <div class="header">
    <a href="index.html">首頁</a>
    <a href="about.html">關於</a>
    <a href="contact.html">聯絡</a>
  </div>

  <div class="container">
    <div class="card">
      <h1>聯絡頁</h1>
      <p>這頁用來測試表單送出事件。</p>
      <p class="small">當前頁面：<code>contact.html</code></p>
    </div>

    <div class="card">
      <h2>聯絡表單</h2>
      <label>姓名</label>
      <input id="name" type="text" placeholder="請輸入姓名" />

      <label>訊息</label>
      <textarea id="message" rows="5" placeholder="請輸入訊息"></textarea>

      <button class="btn" onclick="submitForm()">送出表單</button>
    </div>

    <div class="footer">
      送出後會觸發 <code>contact_form_submit</code> 事件。
    </div>
  </div>

  <script>
    function submitForm() {
      const name = document.getElementById('name').value || 'anonymous';
      const message = document.getElementById('message').value || '';

      gtag('event', 'contact_form_submit', {
        form_name: 'contact_form',
        user_name: name,
        message_length: message.length
      });

      console.log('contact_form_submit', { name, message_length: message.length });
      alert('表單事件已送出');
    }
  </script>
</body>
</html>
